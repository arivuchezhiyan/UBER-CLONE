version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: uber_clone_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: rental-app
    volumes:
      - mongodb_data:/data/db
    networks:
      - uber_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: uber_clone_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - uber_network

  # Backend Server (Node.js / Express)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: uber_clone_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/rental-app
      - JWT_SECRET=production_jwt_secret_key_change_in_env
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
      - redis
    networks:
      - uber_network

  # Frontend Client (React)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: uber_clone_client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - server
    networks:
      - uber_network

volumes:
  mongodb_data:
  redis_data:

networks:
  uber_network:
    driver: bridge
